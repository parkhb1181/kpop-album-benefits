name: rebuild

# 예판 정보는 수시로 바뀐다 (특전 추가·소진). 하루 두 번 다시 긁는다.
on:
  schedule:
    - cron: '0 1,10 * * *'   # KST 10:00 / 19:00
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build
        run: node build.mjs
      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add out
          git diff --staged --quiet || git commit -m "rebuild: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push

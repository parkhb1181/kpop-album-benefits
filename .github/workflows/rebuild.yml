name: rebuild

# 예판 정보는 수시로 바뀐다 (특전 추가·소진, 품절). 하루 두 번 다시 긁는다.
on:
  schedule:
    - cron: '0 1,10 * * *'   # KST 10:00 / 19:00
  workflow_dispatch:

# watch.yml과 같은 그룹. 둘이 동시에 out/을 커밋해 충돌하는 걸 막는다.
concurrency:
  group: site-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      # 저장소 Settings → Variables 에 SITE_URL 을 넣으면 canonical·og:url·sitemap이 절대주소로 나온다.
      SITE_URL: ${{ vars.SITE_URL }}
      # 알림 버튼은 빌드 때 이 값이 있어야 나온다. 없으면 버튼 자체를 안 낸다
      # (눌러도 안 되는 버튼을 두는 것보다 낫다 — build.mjs 참고).
      VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
      # Search Console 소유 확인 파일명 (google....html). 없으면 파일을 안 만든다.
      GOOGLE_VERIFY: ${{ vars.GOOGLE_VERIFY }}
      # 소유 확인 메타태그 토큰. 파일(.html) 방식은 cleanUrls 308 때문에 못 쓴다.
      NAVER_VERIFY: ${{ vars.NAVER_VERIFY }}
      GOOGLE_VERIFY_META: ${{ vars.GOOGLE_VERIFY_META }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install deps
        run: npm ci || npm i

      # 위드뮤는 정적 fetch로 셸만 와서 헤드리스가 필요하다.
      # 없으면 위드뮤만 빠지고 나머지 4사는 그대로 돈다.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # 스텝 단위 타임아웃.
      #
      # 잡 타임아웃(45분)만 있으면 build.mjs가 어느 판매처에서 매달렸을 때
      # 45분을 통째로 태우고, 그동안 site-build 그룹을 잡고 있어 watch까지 막힌다.
      # 실제로 그렇게 한 번 죽었다 — "컴백 탐지" 뒤 36분간 출력 0줄, 앨범 1개도 못 찍음.
      #
      # 정상 빌드는 5~7분이다. 20분이면 느려진 것과 매달린 것이 구분된다.
      - name: Build
        timeout-minutes: 20
        run: node build.mjs

      # 빌드가 7분 걸리는 동안 main이 움직여 있으면 그냥 push는 거부당하고
      # 방금 만든 결과가 통째로 버려진다 (실제로 한 번 날렸다).
      # out/은 매 빌드에서 새로 만들어지므로 충돌 시 방금 만든 쪽이 항상 옳다.
      # 리베이스에서 재적용되는 커밋(=우리 것)이 "theirs"다.
      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add out
          if git diff --staged --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "rebuild: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git push && exit 0
            echo "push 거부됨 — main을 다시 받아 out/을 우리 것으로 얹는다 ($i/3)"
            git fetch origin main
            git rebase -X theirs origin/main || { git rebase --abort; exit 1; }
          done
          exit 1

# 일회성 확인용. 러너 IP에서 X 임베드 타임라인이 열리는지만 본다.
# 결과 확인 후 삭제한다 — 상시 워크플로가 아니다.
name: probe-x

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: syndication 응답 확인
        run: |
          for h in musicplant_kr soundwave_korea Ktown4u_kr Withmuu_twt; do
            url="https://syndication.twitter.com/srv/timeline-profile/screen-name/$h"
            code=$(curl -s -o /tmp/$h.html -w '%{http_code}' -A 'Mozilla/5.0' "$url")
            size=$(wc -c < /tmp/$h.html)
            hits=$(grep -o '특전' /tmp/$h.html | wc -l)
            echo "$h → HTTP $code · ${size}B · 특전 ${hits}건"
            sleep 3
          done

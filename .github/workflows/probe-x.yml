# 일회성 확인용. 러너 IP에서 **로그아웃 상태**로 x.com 프로필이 열리는지 본다.
# syndication은 2025-10에서 멈춘 데이터를 줘서 못 쓴다(확인 완료).
# 확인 후 삭제한다.
name: probe-x

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # playwright는 devDependency다 — --omit=dev를 붙이면 안 받는다
      - run: npm ci || npm i
      - run: npx playwright install --with-deps chromium
      - name: 로그아웃 프로필 렌더 확인
        run: node probe-x.mjs

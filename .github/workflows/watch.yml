name: watch

# 전체 빌드는 판매처 5곳을 다 긁어 오래 걸린다. 그래서 하루 두 번(rebuild.yml)뿐이고,
# 그 주기로는 예판이 열려도 최대 12시간 뒤에 안다.
#
# 이 워크플로는 "뭔가 새로 떴는가"만 싸게 확인하고, 떴을 때만 전체 빌드를 부른다.
#
# 주기는 15분. 저장소가 공개라 Actions 사용량 제한이 없어서 가능하다.
# (비공개였다면 월 2,000분 한도에 걸린다 — 감시가 3초로 끝나도 분 단위 올림 청구라
#  15분 주기가 월 2,880분이 된다. 비공개로 되돌릴 일이 있으면 30분으로 낮춰야 한다.)
#
# 15분이 하한선인 이유는 요금이 아니라 GitHub 쪽 사정이다. cron은 최소 5분 간격이지만
# 실제 실행은 부하에 따라 밀리고, 아주 짧은 주기는 건너뛰기도 한다.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      deep:
        description: '위버스샵 158팀 스캔까지 강제로 수행'
        type: boolean
        default: false

# rebuild.yml과 같은 그룹. 둘이 동시에 out/을 커밋해 충돌하는 걸 막는다.
concurrency:
  group: site-build
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      SITE_URL: ${{ vars.SITE_URL }}
      # 위버스샵 스캔(요청 158건)은 이 간격으로만 한다. 나머지 회차는 메이크스타 1건뿐.
      #
      # 여기서 한계는 요금이 아니라 위버스샵이다. 1시간이면 하루 3,800건 — 동시 8개로
      # 20초쯤 몰아치는 게 하루 24번이다. 이보다 당기면 차단 위험이 실질적으로 커진다.
      # 차단이 시작되면 discover의 failed가 올라가고, watch는 그 회차의 "사라짐" 판정을
      # 스스로 포기한다 (없는 변화를 만들지 않는다). 로그에 경고가 남는다.
      DEEP_INTERVAL_MIN: '60'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install deps
        run: npm ci || npm i

      - id: watch
        name: Watch
        run: node watch.mjs ${{ inputs.deep && '--deep' || '' }}

      # 변화가 없어도 state는 갱신된다(lastDeep 등). 조용히 커밋해 둔다.
      #
      # reason은 긁어온 상품명이다 — 남이 쓴 문자열을 ${{ }}로 셸 명령에 직접 끼워넣으면
      # 백틱·$(...)가 그대로 실행된다. env로 넘겨야 셸이 값으로만 다룬다.
      - name: Commit state
        env:
          REASON: ${{ steps.watch.outputs.reason }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state
          git diff --staged --quiet || git commit -m "watch: $REASON"

      # 여기부터는 새 예판·새 이벤트가 실제로 있을 때만 돈다.
      - name: Install Chromium
        if: steps.watch.outputs.changed == 'true'
        run: npx playwright install --with-deps chromium

      - name: Rebuild
        if: steps.watch.outputs.changed == 'true'
        run: node build.mjs

      - name: Commit site
        if: steps.watch.outputs.changed == 'true'
        env:
          REASON: ${{ steps.watch.outputs.reason }}
        run: |
          git add out
          git diff --staged --quiet || git commit -m "rebuild(watch): $REASON"

      # rebuild.yml과 같은 이유 — 전체 빌드가 도는 동안 main이 움직였을 수 있다.
      # state/와 out/ 둘 다 이번 실행이 만든 게 최신이므로 충돌 시 우리 것을 쓴다.
      - name: Push
        run: |
          for i in 1 2 3; do
            git push && exit 0
            echo "push 거부됨 — main을 다시 받아 우리 것을 얹는다 ($i/3)"
            git fetch origin main
            git rebase -X theirs origin/main || { git rebase --abort; exit 1; }
          done
          exit 1
